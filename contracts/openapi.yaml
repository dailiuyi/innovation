components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
      required:
      - code
      - message
      - traceId
    Login:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 12
          maxLength: 64
      required:
      - username
      - password
    Resource:
      type: object
      additionalProperties: false
      properties:
        id: *id001
      required:
      - id
    SceneCreate:
      type: object
      additionalProperties: false
      properties:
        name: &id005
          type: string
          minLength: 1
          maxLength: 200
        address: &id006
          type: string
          maxLength: 1000
          nullable: true
        longitude: &id007
          type: number
          minimum: -180
          maximum: 180
          nullable: true
        latitude: &id008
          type: number
          minimum: -90
          maximum: 90
          nullable: true
        geoCrs: &id009
          type: string
          enum:
          - WGS84
          - GCJ02
          - BD09
          nullable: true
      required:
      - name
    SceneView:
      type: object
      additionalProperties: false
      properties:
        name: *id005
        address: *id006
        longitude: *id007
        latitude: *id008
        geoCrs: *id009
        id: *id001
        enabled:
          type: boolean
        lockVersion:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - enabled
      - lockVersion
      - createdAt
      - updatedAt
    SceneList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SceneView'
        total:
          type: integer
          minimum: 0
      required:
      - items
      - total
    MarkerCreate:
      type: object
      additionalProperties: false
      properties:
        sceneId: *id001
        widthMeters:
          type: number
          minimum: 1.0e-06
        heightMeters:
          type: number
          minimum: 1.0e-06
        position: &id012
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
        rotation: &id013
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
      required:
      - sceneId
      - widthMeters
      - heightMeters
      - position
      - rotation
    MarkerView:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        code:
          type: string
        sceneId: *id001
      required:
      - id
      - code
      - sceneId
    EnabledUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
      required:
      - enabled
      - expectedVersion
      - reason
    MarkerEnabled:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        reason:
          type: string
          minLength: 1
      required:
      - enabled
      - reason
    VersionCreate:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        variant: *id004
      required:
      - id
      - variant
    VersionView:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        sceneId: *id001
        variant: *id004
        versionNo: &id016
          type: integer
          minimum: 1
        state: &id017
          type: string
          enum:
          - DRAFT
          - READY
          - REVOKED
        lockVersion: &id018
          type: integer
          minimum: 0
      required:
      - id
      - sceneId
      - variant
      - versionNo
      - state
      - lockVersion
    DraftUpdate:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        packages:
          type: object
          additionalProperties: false
          properties: &id019
            ANDROID: &id010
              type: object
              additionalProperties: false
              properties:
                format:
                  type: string
                  minLength: 1
                runtimeVersion:
                  type: string
                  minLength: 1
                minClientBuild:
                  type: integer
                  minimum: 1
                maxClientBuild:
                  type: integer
                  minimum: 1
                entrypoint:
                  type: string
                  minLength: 1
              required:
              - format
              - runtimeVersion
              - minClientBuild
              - entrypoint
            IOS: *id010
            MINIPROGRAM: *id010
          minProperties: 1
        playback: &id015
          type: object
          additionalProperties: false
          properties:
            mode:
              type: string
              enum:
              - LOCAL_INDEPENDENT
            durationMs:
              type: integer
              minimum: 0
            recoveryPolicy:
              type: string
              enum:
              - RESUME_LOCAL_TIME
              - RESTART
          required:
          - mode
          - durationMs
          - recoveryPolicy
        note:
          type: string
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              assetId: *id001
              platform: *id011
              logicalPath:
                type: string
                minLength: 1
            required:
            - assetId
            - platform
            - logicalPath
          minItems: 1
          maxItems: 1000
      required:
      - expectedVersion
      - packages
      - playback
      - note
      - files
    ExpectedVersion:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 0
      required:
      - expectedVersion
    Reason:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - reason
    Publish:
      type: object
      additionalProperties: false
      properties:
        variant: *id004
        versionId:
          type: string
          format: uuid
          nullable: true
        expectedVersion:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - variant
      - versionId
      - expectedVersion
      - reason
    UploadRequest:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        kind:
          type: string
          enum:
          - CAPTURE
          - GS
          - MODEL
          - TEXTURE
          - AUDIO
          - TIMELINE
          - BUNDLE
          - MANIFEST
          - OTHER
        contentType:
          type: string
          minLength: 1
        bytes:
          type: integer
          format: int64
          minimum: 1
        sha256: &id014
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
      - id
      - kind
      - contentType
      - bytes
      - sha256
    UploadIntent:
      type: object
      additionalProperties: false
      properties:
        assetId: *id001
        uploadUrl:
          type: string
          format: uri
        method:
          type: string
          enum:
          - PUT
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - assetId
      - uploadUrl
      - method
      - headers
      - expiresAt
    UploadComplete:
      type: object
      additionalProperties: false
      properties:
        objectVersion:
          type: string
          minLength: 1
      required:
      - objectVersion
    AssetView:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        state:
          type: string
          enum:
          - PENDING
          - READY
          - REJECTED
          - REVOKED
      required:
      - id
      - state
    RuntimeManifest:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          enum:
          - 1
        sceneId: *id001
        versionId: *id001
        versionNo:
          type: integer
          minimum: 1
        variant: *id004
        platform: *id011
        format:
          type: string
          minLength: 1
        runtimeVersion:
          type: string
          minLength: 1
        clientBuildRange:
          type: object
          additionalProperties: false
          properties:
            min:
              type: integer
              minimum: 1
            max:
              type: integer
              minimum: 1
          required:
          - min
        coordinateSystem:
          type: string
          enum:
          - scene-local-v1
        markers:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              markerId: *id001
              widthMeters:
                type: number
                minimum: 1.0e-06
              heightMeters:
                type: number
                minimum: 1.0e-06
              sceneFromMarker:
                type: object
                additionalProperties: false
                properties:
                  position: *id012
                  rotation: *id013
                required:
                - position
                - rotation
            required:
            - markerId
            - widthMeters
            - heightMeters
            - sceneFromMarker
          minItems: 1
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              assetId: *id001
              logicalPath:
                type: string
                minLength: 1
              sha256: *id014
              bytes:
                type: integer
                format: int64
                minimum: 1
              url:
                type: string
                format: uri
                pattern: ^https://
              expiresAt:
                type: string
                format: date-time
            required:
            - assetId
            - logicalPath
            - sha256
            - bytes
            - url
            - expiresAt
          minItems: 1
          maxItems: 1000
        entrypoint:
          type: string
          minLength: 1
        playback: *id015
      required:
      - schemaVersion
      - sceneId
      - versionId
      - versionNo
      - variant
      - platform
      - format
      - runtimeVersion
      - clientBuildRange
      - coordinateSystem
      - markers
      - files
      - entrypoint
      - playback
    VersionList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VersionView'
      required:
      - items
    VersionDetail:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        sceneId: *id001
        variant: *id004
        versionNo: *id016
        state: *id017
        lockVersion: *id018
        packages:
          type: object
          additionalProperties: false
          properties: *id019
        playback: *id015
        note:
          type: string
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              assetId: *id001
              platform: *id011
              logicalPath:
                type: string
                minLength: 1
            required:
            - assetId
            - platform
            - logicalPath
      required:
      - id
      - sceneId
      - variant
      - versionNo
      - state
      - lockVersion
      - packages
      - playback
      - note
      - files
    SceneUpdate:
      type: object
      additionalProperties: false
      properties:
        name: *id005
        address: *id006
        longitude: *id007
        latitude: *id008
        geoCrs: *id009
        expectedVersion:
          type: integer
          minimum: 0
      required:
      - name
      - expectedVersion
    FrameworkResponse:
      type: object
      additionalProperties: true
      properties:
        code:
          type: integer
        msg:
          type: string
    AccountCreate:
      type: object
      additionalProperties: false
      properties:
        userName:
          type: string
          pattern: ^[A-Za-z0-9_]{3,30}$
        nickName:
          type: string
          minLength: 1
          maxLength: 30
        password:
          type: string
          minLength: 12
          maxLength: 64
      required:
      - userName
      - nickName
      - password
    AccountStatus:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - '0'
          - '1'
      required:
      - userId
      - status
    AccountPassword:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: integer
          format: int64
        password:
          type: string
          minLength: 12
          maxLength: 64
      required:
      - userId
      - password
    OwnPassword:
      type: object
      additionalProperties: false
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
          minLength: 12
          maxLength: 64
      required:
      - oldPassword
      - newPassword
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        nickName:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 50
        phonenumber:
          type: string
          maxLength: 11
        sex:
          type: string
          enum:
          - '0'
          - '1'
          - '2'
    AuditList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
          minimum: 0
      required:
      - items
      - total
